<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayush Pal | Portfolio</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/spa.css') }}">
</head>
<body class="spa-body">
  <div id="tsparticles"></div>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" data-link>
        <span class="brand-mark">AP</span>
        <span class="brand-copy">Ayush Pal</span>
      </a>

      <div class="nav-cluster">
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Toggle navigation"
          data-nav-toggle
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="site-nav" class="site-nav" aria-label="Primary" data-nav-panel>
          <a href="/" data-link data-route="/">Home</a>
          <a href="/about" data-link data-route="/about">About</a>
          <a href="/education" data-link data-route="/education">Education</a>
          <a href="/skills" data-link data-route="/skills">Skills</a>
          <a href="/experience" data-link data-route="/experience">Experience</a>
          <a href="/projects" data-link data-route="/projects">Projects</a>
          <a href="/certifications" data-link data-route="/certifications">Certifications</a>
          <a href="/contact" data-link data-route="/contact">Contact</a>
        </nav>
      </div>

      <a class="admin-link" href="{{ url_for('admin_login') }}">Admin</a>
    </header>

    <div class="shell-progress" id="shell-progress" hidden></div>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-view">
        <p>Loading portfolio data...</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/spa.js') }}"></script>
</body>
</html>
